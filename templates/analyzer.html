<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>HateShield — Analyzer</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
    <style>
        textarea { width:100%; background:rgba(255,255,255,.03); border:1px solid var(--border); border-radius:12px; color:var(--text); padding:18px; resize:none; outline:none; margin-top: 20px; }
        .input-card { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 24px; margin-top: 40px; }
        .btn-analyze { background: var(--red); color: white; border: none; padding: 12px 24px; border-radius: 10px; font-weight: bold; cursor: pointer; margin-top: 15px; }
    </style>
</head>
<body>
    <div class="grid-bg"></div>
    <div class="glow-orb orb1"></div>
    <div class="glow-orb orb2"></div>

    <nav>
        <div class="container">
            <div class="nav-inner">
                <a href="index.html" class="logo">Hate<span>Shield</span></a>
                <a href="index.html" class="nav-back-btn">← Back to Home</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="hero">
            <h1>🛡️ HateShield Analyzer</h1>
            <p>Paste any text below to check for harmful language.</p>
        </div>

        <div class="input-card">
            <textarea id="input" rows="6" placeholder="Paste text here..."></textarea>
            <button class="btn-analyze" id="analyze-btn" onclick="startAnalysis()">
    ⚡ Analyze Content
            </button>
            <div id="loading" style="display:none;">Analyzing...</div>
            <div id="results"></div>
        </div>
    </div>
    <script src="{{ url_for('static', filename='shared.js') }}"></script>
</body>
</html>
